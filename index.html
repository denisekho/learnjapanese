<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghost Voice Animation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stage">
    <div class="ghost-float" id="ghostFloat">
      <div class="ghost-voice" id="ghostVoice">
        <svg viewBox="0 0 512 560" width="320" height="350" class="ghost-svg" aria-hidden="true">
          <defs>
            <clipPath id="ghostClip">
              <path
                d="M256 20
                   C 340 20 396 92 396 180
                   L 396 300
                   C 396 336 412 350 408 378
                   C 404 402 424 412 414 438
                   C 400 424 392 410 378 418
                   C 368 436 376 452 362 466
                   C 350 448 344 432 330 436
                   C 320 456 322 470 306 476
                   C 296 458 294 446 280 448
                   C 272 464 274 478 256 480
                   C 238 478 240 464 232 448
                   C 218 446 216 458 206 476
                   C 190 470 192 456 182 436
                   C 168 432 162 448 150 466
                   C 136 452 144 436 134 418
                   C 120 410 112 424 98 438
                   C 88 412 108 402 104 378
                   C 100 350 116 336 116 300
                   L 116 180
                   C 116 92 172 20 256 20 Z"
              />
            </clipPath>
            <linearGradient id="bodyFill" x1="10%" y1="0%" x2="90%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
              <stop offset="38%" stop-color="#eef7fc" stop-opacity="0.5" />
              <stop offset="72%" stop-color="#cfe3ee" stop-opacity="0.62" />
              <stop offset="100%" stop-color="#9db6c9" stop-opacity="0.88" />
            </linearGradient>
            <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
              <stop offset="55%" stop-color="#bcd2e4" stop-opacity="0.55" />
              <stop offset="100%" stop-color="#7e96ab" stop-opacity="0.9" />
            </linearGradient>
            <radialGradient id="sheen" cx="32%" cy="22%" r="55%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
              <stop offset="55%" stop-color="#ffffff" stop-opacity="0.2" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>
            <filter id="ghostGlow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
            <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="13" />
            </filter>
          </defs>

          <g id="ghostGlowGroup" filter="url(#ghostGlow)">
            <path
              id="ghostBody"
              d="M256 20
                 C 340 20 396 92 396 180
                 L 396 300
                 C 396 336 412 350 408 378
                 C 404 402 424 412 414 438
                 C 400 424 392 410 378 418
                 C 368 436 376 452 362 466
                 C 350 448 344 432 330 436
                 C 320 456 322 470 306 476
                 C 296 458 294 446 280 448
                 C 272 464 274 478 256 480
                 C 238 478 240 464 232 448
                 C 218 446 216 458 206 476
                 C 190 470 192 456 182 436
                 C 168 432 162 448 150 466
                 C 136 452 144 436 134 418
                 C 120 410 112 424 98 438
                 C 88 412 108 402 104 378
                 C 100 350 116 336 116 300
                 L 116 180
                 C 116 92 172 20 256 20 Z"
              fill="url(#bodyFill)"
              stroke="url(#rimStroke)"
              stroke-width="3"
            />

            <g clip-path="url(#ghostClip)">
              <ellipse cx="180" cy="320" rx="20" ry="110" fill="#ffffff" opacity="0.16" filter="url(#softBlur)" transform="rotate(-16 180 320)" />
              <ellipse cx="340" cy="350" rx="15" ry="85" fill="#ffffff" opacity="0.12" filter="url(#softBlur)" transform="rotate(14 340 350)" />
              <ellipse cx="256" cy="440" rx="140" ry="26" fill="#5f7c93" opacity="0.22" filter="url(#softBlur)" />
              <path
                d="M256 20
                   C 340 20 396 92 396 180
                   L 396 300
                   C 396 336 412 350 408 378
                   C 404 402 424 412 414 438
                   C 400 424 392 410 378 418
                   C 368 436 376 452 362 466
                   C 350 448 344 432 330 436
                   C 320 456 322 470 306 476
                   C 296 458 294 446 280 448
                   C 272 464 274 478 256 480
                   C 238 478 240 464 232 448
                   C 218 446 216 458 206 476
                   C 190 470 192 456 182 436
                   C 168 432 162 448 150 466
                   C 136 452 144 436 134 418
                   C 120 410 112 424 98 438
                   C 88 412 108 402 104 378
                   C 100 350 116 336 116 300
                   L 116 180
                   C 116 92 172 20 256 20 Z"
                fill="url(#sheen)"
              />
            </g>

            <!-- eyes -->
            <ellipse cx="200" cy="196" rx="24" ry="34" fill="#12151a" />
            <ellipse cx="312" cy="196" rx="24" ry="34" fill="#12151a" />
            <circle cx="192" cy="182" r="5" fill="#ffffff" opacity="0.85" />
            <circle cx="304" cy="182" r="5" fill="#ffffff" opacity="0.85" />

            <!-- mouth: scaled horizontally by JS to react to voice volume -->
            <ellipse id="ghostMouth" cx="256" cy="262" rx="20" ry="11" fill="#12151a" />
          </g>
        </svg>
      </div>
    </div>

    <div class="controls">
      <button id="micButton" class="mic-button">🎤 Enable voice</button>
      <p id="status" class="status">Click to let the ghost hear you</p>
      <div class="meter"><div id="meterFill" class="meter-fill"></div></div>
    </div>
  </main>

  <script src="ghost.js"></script>
</body>
</html>
